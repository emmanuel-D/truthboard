name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test before anything ships
        run: go vet ./... && go test ./...

      - name: Build all platforms
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            goos=${t%/*}; goarch=${t#*/}; ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w -X main.version=${tag}" \
              -o "dist/truthboard${ext}" ./cmd/truthboard
            tar -czf "dist/truthboard_${tag}_${goos}_${goarch}.tar.gz" -C dist "truthboard${ext}"
            rm "dist/truthboard${ext}"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/checksums.txt \
            --title "Truthboard ${GITHUB_REF_NAME}" --generate-notes

      # Keeps the tap (emmanuel-D/homebrew-truthboard) current on every tag.
      # Needs a PAT with contents:write on the tap repo in the
      # HOMEBREW_TAP_TOKEN secret.
      #
      # By the time this runs the release exists — archives built, checksums
      # uploaded, release created — so nothing here may fail the job. A red
      # run against a shipped tag reads as "the release failed" when the real
      # fault is a formula needing one manual commit. An absent token is the
      # expected case before the secret is set; an expired, revoked or
      # under-scoped one is the case that turns up months later, unannounced,
      # and it must land as a warning too, not as a failed release.
      - name: Bump homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — tap not bumped for ${GITHUB_REF_NAME}." \
                 "Add a PAT with contents:write on emmanuel-D/homebrew-truthboard as that secret;" \
                 "until then, regenerate Formula/truthboard.rb by hand."
            exit 0
          fi
          # -e inside the function only: a failure here must reach the
          # warning below rather than end the job.
          bump() {
            set -e
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/emmanuel-D/homebrew-truthboard.git" tap
            mkdir -p tap/Formula
            ./.github/scripts/brew-formula.sh "${GITHUB_REF_NAME}" dist/checksums.txt > tap/Formula/truthboard.rb
            cd tap
            git add Formula/truthboard.rb
            git -c user.name="truthboard-release" -c user.email="noreply@github.com" \
              commit -m "truthboard ${GITHUB_REF_NAME}" || { echo "formula unchanged"; return 0; }
            git push origin HEAD
          }
          if ! bump; then
            echo "::warning::tap bump failed for ${GITHUB_REF_NAME} — expired, revoked or under-scoped" \
                 "HOMEBREW_TAP_TOKEN? The release itself shipped; bump Formula/truthboard.rb by hand" \
                 "(.github/scripts/brew-formula.sh ${GITHUB_REF_NAME} checksums.txt)."
          fi
